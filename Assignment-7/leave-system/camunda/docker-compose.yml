services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: camunda-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "8080:8080"
      - "26500:26500"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 15

  camunda:
    image: camunda/camunda:8.8.9
    container_name: camunda-platform
    network_mode: "service:elasticsearch"
    environment:
      - camunda.security.authentication.unprotected-api=true
      - CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI=true
    depends_on:
      elasticsearch:
        condition: service_healthy